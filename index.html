<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>nyorong nail 嬉希工作室 — 線上預約</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #faf9fc; color: #2a2a2a; font-family: 'Jost', sans-serif; font-weight: 300; }
    .app { max-width: 1200px; margin: 0 auto; padding: 2.5rem 1.5rem; min-height: 100vh; }
    .inner { max-width: 480px; margin: 0 auto; }

    .brand { text-align: center; margin-bottom: 2rem; }
    .brand-name { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 300; letter-spacing: 0.1em; color: #2a2a2a; }
    .brand-sub { font-size: 11px; letter-spacing: 0.28em; color: #aaa; text-transform: uppercase; margin-top: 4px; }

    .step-bar { display: flex; align-items: center; justify-content: center; margin-bottom: 2.5rem; }
    .step { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .step-dot { width: 28px; height: 28px; border-radius: 50%; border: 1px solid #ccc; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #aaa; background: #fff; transition: all 0.25s; }
    .step.active .step-dot { background: #B0A0C8; border-color: #B0A0C8; color: #fff; }
    .step.done .step-dot { background: #f0ecf7; border-color: #B0A0C8; color: #B0A0C8; }
    .step-label { font-size: 10px; letter-spacing: 0.12em; color: #aaa; }
    .step.active .step-label { color: #B0A0C8; }
    .step-line { flex: 1; height: 1px; background: #e5e5e5; max-width: 60px; margin-bottom: 18px; }

    .section-title { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 300; letter-spacing: 0.06em; margin-bottom: 1.25rem; color: #2a2a2a; }

    .datetime-wrap { border: 0.5px solid #e0dce8; border-radius: 12px; overflow: hidden; margin-bottom: 2rem; background: #fff; }
    .cal-section { padding: 1.25rem; border-bottom: 0.5px solid #e0dce8; }
    .time-section { padding: 1.25rem; }
    .block-label { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: #aaa; margin-bottom: 1rem; }

    .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
    .cal-title { font-size: 14px; font-weight: 500; letter-spacing: 0.05em; }
    .cal-nav { background: none; border: 0.5px solid #e0dce8; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-size: 13px; color: #666; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
    .cal-nav:hover:not(:disabled) { border-color: #B0A0C8; color: #B0A0C8; }
    .cal-nav:disabled { opacity: 0.25; cursor: default; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .cal-dow { text-align: center; font-size: 10px; color: #aaa; letter-spacing: 0.08em; padding: 4px 0 8px; }
    .cal-dow.weekend { color: #e07070; }
    .cal-day { text-align: center; font-size: 13px; border-radius: 50%; cursor: default; transition: all 0.2s; color: #2a2a2a; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; }
    .cal-day.weekend { color: #e07070; }
    .cal-day.available { cursor: pointer; }
    .cal-day.available:hover { background: #ede8f5; }
    .cal-day.selected { background: #B0A0C8 !important; color: #fff !important; cursor: pointer; }
    .cal-day.disabled { color: #ccc !important; opacity: 0.35; }
    .cal-day.empty { }

    .time-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .time-slot { border: 0.5px solid #e0dce8; border-radius: 8px; padding: 10px 4px; text-align: center; font-size: 14px; letter-spacing: 0.05em; cursor: pointer; transition: all 0.2s; color: #666; }
    .time-slot:hover { border-color: #B0A0C8; color: #9070B8; }
    .time-slot.selected { background: #B0A0C8; border-color: #B0A0C8; color: #fff; }
    .time-slot.booked { background: #f5f5f5; border-color: #e8e8e8; color: #ccc; cursor: not-allowed; text-decoration: line-through; }
    .time-slot.booked:hover { border-color: #e8e8e8; color: #ccc; }

    /* Service blocks */
    .svc-block { border: 0.5px solid #e0dce8; border-radius: 12px; overflow: hidden; margin-bottom: 1rem; background: #fff; }
    .svc-block-header { padding: 12px 16px; background: #f5f0fa; display: flex; align-items: center; justify-content: space-between; }
    .svc-block-title { font-size: 13px; font-weight: 500; letter-spacing: 0.08em; color: #9070B8; text-transform: uppercase; }
    .svc-block-selected { font-size: 12px; color: #B0A0C8; }
    .svc-block-body { padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
    .sub-item { display: flex; align-items: center; justify-content: space-between; border: 0.5px solid #e0dce8; border-radius: 8px; padding: 10px 14px; cursor: pointer; transition: all 0.2s; background: #fff; }
    .sub-item:hover { border-color: #B0A0C8; }
    .sub-item.selected { border: 1.5px solid #B0A0C8; background: #f5f0fa; }
    .sub-item-name { font-size: 13px; color: #2a2a2a; }
    .sub-item-price { font-size: 13px; color: #9070B8; font-weight: 500; }
    .addon-label { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: #aaa; padding: 8px 14px 4px; }
    .sub-item.addon { background: #fdfbff; }
    .sub-item.addon.selected { border: 1.5px solid #c8b8e0; background: #f0eafa; }
    .sub-item.addon .sub-item-price { color: #b090d0; }

    .form-group { margin-bottom: 1rem; }
    .form-label { font-size: 11px; letter-spacing: 0.12em; color: #aaa; display: block; margin-bottom: 6px; text-transform: uppercase; }
    .form-input { width: 100%; border: 0.5px solid #e0dce8; border-radius: 8px; padding: 10px 14px; font-size: 14px; font-family: 'Jost', sans-serif; background: #fff; color: #2a2a2a; transition: border-color 0.2s; }
    .form-input:focus { outline: none; border-color: #B0A0C8; }

    .summary-card { border: 0.5px solid #B0A0C8; border-radius: 12px; padding: 1.25rem; margin-bottom: 1.5rem; background: #f5f0fa; }
    .summary-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; font-size: 13px; border-bottom: 0.5px solid #e0dce8; }
    .summary-row:last-child { border-bottom: none; font-weight: 500; font-size: 15px; margin-top: 4px; }
    .summary-label { color: #666; }
    .summary-value { color: #2a2a2a; }
    .summary-value.price { color: #9070B8; }

    .btn-primary { width: 100%; background: #B0A0C8; border: none; border-radius: 8px; padding: 14px; font-size: 13px; letter-spacing: 0.15em; text-transform: uppercase; color: #fff; cursor: pointer; font-family: 'Jost', sans-serif; transition: background 0.2s; margin-bottom: 0.75rem; }
    .btn-primary:hover:not(:disabled) { background: #9070B8; }
    .btn-primary:disabled { opacity: 0.4; cursor: default; }
    .btn-secondary { width: 100%; background: none; border: 0.5px solid #ccc; border-radius: 8px; padding: 12px; font-size: 12px; letter-spacing: 0.1em; color: #666; cursor: pointer; font-family: 'Jost', sans-serif; transition: all 0.2s; }
    .btn-secondary:hover { border-color: #B0A0C8; color: #B0A0C8; }

    .success-screen { text-align: center; padding: 2rem 1rem; display: none; }
    .success-icon { width: 64px; height: 64px; border-radius: 50%; background: #ede8f5; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; font-size: 28px; }
    .success-title { font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 300; letter-spacing: 0.06em; margin-bottom: 0.75rem; }
    .success-sub { font-size: 13px; color: #666; line-height: 1.7; margin-bottom: 2rem; }
    .booking-code { display: inline-block; border: 0.5px solid #B0A0C8; border-radius: 8px; padding: 8px 20px; font-size: 18px; letter-spacing: 0.25em; color: #9070B8; margin-bottom: 2rem; }

    .page { display: none; }
    .page.active { display: block; }
  </style>
</head>
<body>
<div class="app">
  <div class="inner">
    <div class="brand">
      <div class="brand-name">nyorong nail 嬉希工作室</div>
      <div class="brand-sub">線上預約系統</div>
    </div>

    <div class="step-bar" id="stepBar">
      <div class="step active" data-step="1"><div class="step-dot">1</div><div class="step-label">日期</div></div>
      <div class="step-line"></div>
      <div class="step" data-step="2"><div class="step-dot">2</div><div class="step-label">服務</div></div>
      <div class="step-line"></div>
      <div class="step" data-step="3"><div class="step-dot">3</div><div class="step-label">資訊</div></div>
      <div class="step-line"></div>
      <div class="step" data-step="4"><div class="step-dot">4</div><div class="step-label">確認</div></div>
    </div>

    <!-- Page 1 -->
    <div id="page1" class="page active">
      <div class="section-title">選擇日期與時段</div>
      <div class="datetime-wrap">
        <div class="cal-section">
          <div class="block-label">日期</div>
          <div class="cal-header">
            <button class="cal-nav" id="prevMonth">&#8249;</button>
            <div class="cal-title" id="calTitle"></div>
            <button class="cal-nav" id="nextMonth">&#8250;</button>
          </div>
          <div class="cal-grid" id="calGrid"></div>
        </div>
        <div class="time-section">
          <div class="block-label">時段</div>
          <div class="time-grid">
            <div class="time-slot" data-slot="10:00">10:00</div>
            <div class="time-slot" data-slot="14:00">14:00</div>
            <div class="time-slot" data-slot="18:00">18:00</div>
          </div>
        </div>
      </div>
      <button class="btn-primary" id="btn1" disabled>下一步 — 選擇服務</button>
    </div>

    <!-- Page 2 -->
    <div id="page2" class="page">
      <div class="section-title">選擇服務項目</div>

      <!-- 卸甲 -->
      <div class="svc-block">
        <div class="svc-block-header">
          <span class="svc-block-title">卸甲</span>
          <span class="svc-block-selected" id="sel-卸甲">請選擇</span>
        </div>
        <div class="svc-block-body" id="body-卸甲"></div>
      </div>

      <!-- 凝膠 -->
      <div class="svc-block">
        <div class="svc-block-header">
          <span class="svc-block-title">凝膠</span>
          <span class="svc-block-selected" id="sel-凝膠">請選擇</span>
        </div>
        <div class="svc-block-body" id="body-凝膠"></div>
      </div>

      <!-- 造型 -->
      <div class="svc-block" style="margin-bottom:2rem;">
        <div class="svc-block-header">
          <span class="svc-block-title">造型</span>
          <span class="svc-block-selected" id="sel-造型">請選擇</span>
        </div>
        <div class="svc-block-body" id="body-造型"></div>
      </div>

      <button class="btn-primary" id="btn2" disabled>下一步 — 填寫資料</button>
      <button class="btn-secondary" id="back1">返回上一步</button>
    </div>

    <!-- Page 3 -->
    <div id="page3" class="page">
      <div class="section-title">填寫個人資料</div>
      <div class="form-group">
        <label class="form-label">姓名</label>
        <input class="form-input" type="text" placeholder="您的姓名" id="fName">
      </div>
      <div class="form-group">
        <label class="form-label">IG 帳號</label>
        <input class="form-input" type="text" placeholder="@yourhandle" id="fIG">
      </div>
      <div class="form-group">
        <label class="form-label">電子郵件（選填）</label>
        <input class="form-input" type="email" placeholder="your@email.com" id="fEmail">
      </div>
      <div class="form-group">
        <label class="form-label">備註</label>
        <textarea class="form-input" rows="3" placeholder="例如：想做的顏色、參考圖案等..." id="fNote" style="resize:none;"></textarea>
      </div>
      <button class="btn-primary" id="btn3">下一步 — 確認預約</button>
      <button class="btn-secondary" id="back2">返回上一步</button>
    </div>

    <!-- Page 4 -->
    <div id="page4" class="page">
      <div class="section-title">確認預約資訊</div>
      <div class="summary-card" id="summaryCard"></div>
      <button class="btn-primary" id="btnConfirm">確認預約</button>
      <button class="btn-secondary" id="back3">返回修改</button>
    </div>

    <!-- Success -->
    <div class="success-screen" id="successPage">
      <div class="success-icon">🌸</div>
      <div class="success-title">預約成功！</div>
      <div class="success-sub">感謝您預約 nyorong nail 嬉希工作室。<br>我們將盡快與您確認。</div>
      <div class="booking-code" id="bookingCode"></div>
      <button class="btn-primary" onclick="resetAll()">返回首頁</button>
    </div>
  </div>
</div>

<script>
  const state = {
    date: null, slot: null, service: null, price: 0, dur: '',
    name: '', ig: '', email: '', note: '',
    calYear: 2026, calMonth: 4  // 從 2026年5月開始（month index 4）
  };

  // 可預約日期：key = "YYYY-M"（月份 1-based）
  const AVAILABLE = {
    '2026-5': [9, 10, 16, 17, 23, 24, 30, 31],
    '2026-6': []
  };

  const MIN_YEAR = 2026, MIN_MONTH = 4;  // 5月
  const MAX_YEAR = 2026, MAX_MONTH = 5;  // 6月

  const MONTHS = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  // 星期一到日
  const DAYS_DISPLAY = ['一','二','三','四','五','六','日'];

  function isAvailable(year, month, day) {
    const key = year + '-' + (month + 1);
    const list = AVAILABLE[key];
    return list && list.includes(day);
  }

  function checkPage1() {
    document.getElementById('btn1').disabled = !(state.date && state.slot);
  }

  function showPage(n) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('successPage').style.display = 'none';
    const pg = document.getElementById('page' + n);
    if (pg) pg.classList.add('active');
    updateSteps(n);
  }

  function updateSteps(n) {
    document.querySelectorAll('.step').forEach(s => {
      const sn = parseInt(s.dataset.step);
      s.classList.remove('active','done');
      if (sn === n) s.classList.add('active');
      else if (sn < n) s.classList.add('done');
    });
  }

  function renderCalendar() {
    const { calYear, calMonth } = state;
    document.getElementById('calTitle').textContent = calYear + ' 年 ' + MONTHS[calMonth];

    const prevBtn = document.getElementById('prevMonth');
    const nextBtn = document.getElementById('nextMonth');
    prevBtn.disabled = (calYear === MIN_YEAR && calMonth === MIN_MONTH);
    nextBtn.disabled = (calYear === MAX_YEAR && calMonth === MAX_MONTH);

    const grid = document.getElementById('calGrid');
    grid.innerHTML = '';

    // 欄位標題（一～日），六日紅色
    DAYS_DISPLAY.forEach((d, i) => {
      const el = document.createElement('div');
      el.className = 'cal-dow';
      if (i >= 5) el.classList.add('weekend'); // index 5=六, 6=日
      el.textContent = d;
      grid.appendChild(el);
    });

    const firstJsDay = new Date(calYear, calMonth, 1).getDay(); // 0=Sun
    // 轉為星期一為首的 offset：Mon→0, Tue→1, ... Sun→6
    const offset = (firstJsDay === 0) ? 6 : firstJsDay - 1;
    const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();

    for (let i = 0; i < offset; i++) {
      const el = document.createElement('div'); el.className = 'cal-day empty'; grid.appendChild(el);
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const el = document.createElement('div');
      el.className = 'cal-day';
      el.textContent = d;

      const thisDate = new Date(calYear, calMonth, d);
      const jsDay = thisDate.getDay(); // 0=Sun, 6=Sat
      const isSat = jsDay === 6;
      const isSun = jsDay === 0;

      if (isSat || isSun) el.classList.add('weekend');

      const available = isAvailable(calYear, calMonth, d);

      if (available) {
        el.classList.add('available');
        if (state.date && state.date.toDateString() === thisDate.toDateString()) {
          el.classList.add('selected');
        }
        el.addEventListener('click', () => {
          state.date = thisDate;
          renderCalendar();
          checkPage1();
          updateTimeSlots();
        });
      } else {
        el.classList.add('disabled');
      }

      grid.appendChild(el);
    }
  }

  document.getElementById('prevMonth').addEventListener('click', () => {
    if (state.calYear === MIN_YEAR && state.calMonth === MIN_MONTH) return;
    state.calMonth--;
    if (state.calMonth < 0) { state.calMonth = 11; state.calYear--; }
    renderCalendar();
  });
  document.getElementById('nextMonth').addEventListener('click', () => {
    if (state.calYear === MAX_YEAR && state.calMonth === MAX_MONTH) return;
    state.calMonth++;
    if (state.calMonth > 11) { state.calMonth = 0; state.calYear++; }
    renderCalendar();
  });

  document.querySelectorAll('.time-slot').forEach(el => {
    el.addEventListener('click', () => {
      if (el.classList.contains('booked')) return;
      document.querySelectorAll('.time-slot').forEach(x => x.classList.remove('selected'));
      el.classList.add('selected');
      state.slot = el.dataset.slot;
      checkPage1();
    });
  });

  document.getElementById('btn1').addEventListener('click', () => { if (state.date && state.slot) showPage(2); });
  document.getElementById('back1').addEventListener('click', () => showPage(1));
  document.getElementById('back2').addEventListener('click', () => showPage(2));
  document.getElementById('back3').addEventListener('click', () => showPage(3));

  // ── Service data ──────────────────────────────────────────────
  const SERVICES = {
    '卸甲': {
      items: [
        { name: '不需卸甲', price: 0 },
        { name: '本店續作', price: 200 },
        { name: '他店續作', price: 300 },
        { name: '指甲油（含透明硬甲油）', price: 50 },
        { name: '本店純卸甲', price: 400 },
      ],
      addons: [
        { name: '硬繭＆指緣護理', price: 100 }
      ]
    },
    '凝膠': {
      items: [
        { name: '單色', price: 600 },
        { name: '貓眼', price: 700 },
        { name: '鏡面', price: 800 },
      ],
      addons: [
        { name: '跳一色', price: 100 }
      ]
    },
    '造型': {
      items: [
        { name: '立體造型', price: '$10–$80' },
        { name: '手繪設計', price: '$20–$80' },
        { name: '無需造型', price: 0 },
      ],
      addons: []
    }
  };

  // state for page 2
  const svcState = {
    '卸甲': { item: null, addon: null },
    '凝膠': { item: null, addon: null },
    '造型': { item: null, addon: null },
  };

  function checkPage2() {
    const allSelected = ['卸甲','凝膠','造型'].every(cat => svcState[cat].item !== null);
    document.getElementById('btn2').disabled = !allSelected;
  }

  function renderBlock(cat) {
    const body = document.getElementById('body-' + cat);
    const selEl = document.getElementById('sel-' + cat);
    const data = SERVICES[cat];
    body.innerHTML = '';

    // Main items
    data.items.forEach(item => {
      const el = document.createElement('div');
      el.className = 'sub-item';
      if (svcState[cat].item === item.name) el.classList.add('selected');
      const priceStr = typeof item.price === 'number'
        ? (item.price === 0 ? 'NT$0' : 'NT$' + item.price.toLocaleString())
        : 'NT' + item.price;
      el.innerHTML = `<span class="sub-item-name">${item.name}</span><span class="sub-item-price">${priceStr}</span>`;
      el.addEventListener('click', () => {
        svcState[cat].item = item.name;
        svcState[cat].itemPrice = typeof item.price === 'number' ? item.price : null;
        renderBlock(cat);
        checkPage2();
      });
      body.appendChild(el);
    });

    // Addons
    if (data.addons.length > 0) {
      const lbl = document.createElement('div');
      lbl.className = 'addon-label';
      lbl.textContent = '加購項目';
      body.appendChild(lbl);
      data.addons.forEach(addon => {
        const el = document.createElement('div');
        el.className = 'sub-item addon';
        if (svcState[cat].addon === addon.name) el.classList.add('selected');
        el.innerHTML = `<span class="sub-item-name">${addon.name}</span><span class="sub-item-price">+NT$${addon.price.toLocaleString()}</span>`;
        el.addEventListener('click', () => {
          // toggle
          svcState[cat].addon = (svcState[cat].addon === addon.name) ? null : addon.name;
          svcState[cat].addonPrice = (svcState[cat].addon) ? addon.price : 0;
          renderBlock(cat);
        });
        body.appendChild(el);
      });
    }

    // Update header label
    if (svcState[cat].item) {
      const addonText = svcState[cat].addon ? `＋${svcState[cat].addon}` : '';
      selEl.textContent = svcState[cat].item + addonText;
    } else {
      selEl.textContent = '請選擇';
    }
  }

  function initBlocks() {
    ['卸甲','凝膠','造型'].forEach(cat => renderBlock(cat));
  }

  function getTotalPrice() {
    let total = 0;
    ['卸甲','凝膠','造型'].forEach(cat => {
      total += svcState[cat].itemPrice || 0;
      total += svcState[cat].addonPrice || 0;
    });
    return total;
  }

  function getServiceSummary() {
    return ['卸甲','凝膠','造型'].map(cat => {
      let txt = cat + '：' + svcState[cat].item;
      if (svcState[cat].addon) txt += '＋' + svcState[cat].addon;
      return txt;
    }).join('　');
  }

  initBlocks();

  document.getElementById('btn2').addEventListener('click', () => {
    if (['卸甲','凝膠','造型'].every(cat => svcState[cat].item !== null)) showPage(3);
  });

  document.getElementById('btn3').addEventListener('click', () => {
    const n = document.getElementById('fName').value.trim();
    const ig = document.getElementById('fIG').value.trim();
    if (!n || !ig) { alert('請填寫姓名與 IG 帳號'); return; }
    state.name = n; state.ig = ig;
    state.email = document.getElementById('fEmail').value;
    state.note = document.getElementById('fNote').value;
    renderSummary(); showPage(4);
  });

  function renderSummary() {
    const d = state.date;
    const dateStr = d.getFullYear() + ' 年 ' + (d.getMonth()+1) + ' 月 ' + d.getDate() + ' 日';

    const cats = ['卸甲','凝膠','造型'];
    const serviceRows = cats.map(cat => {
      let label = cat;
      let val = svcState[cat].item;
      if (svcState[cat].addon) val += '　＋' + svcState[cat].addon;
      return [label, val];
    });

    const total = getTotalPrice();

    const rows = [
      ['預約日期', dateStr],
      ['預約時段', state.slot],
      ...serviceRows,
      ['姓名', state.name],
      ['IG 帳號', state.ig],
      ...(state.email ? [['電子郵件', state.email]] : []),
      ...(state.note ? [['備註', state.note]] : []),
      ['合計費用', 'NT$' + total.toLocaleString() + (cats.some(c => svcState[c].item === '立體造型' || svcState[c].item === '手繪設計') ? '（造型費用依設計確認）' : '')],
    ];
    document.getElementById('summaryCard').innerHTML = rows.map((r, i) =>
      `<div class="summary-row"><span class="summary-label">${r[0]}</span><span class="summary-value${i===rows.length-1?' price':''}">${r[1]}</span></div>`
    ).join('');
  }

  // ▼ 請將部署後的 Google Apps Script 網址貼在這裡 ▼
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbw8o4WAxBGkGLzsa_k6yQHiM_f8xwO3yknsnNcUX7_ZBbtxW9AF-kiUiKOEM8iDyHY3/exec';

  // ── 已預約時段 ─────────────────────────────────────
  let bookedSlots = {};

  async function loadBookedSlots() {
    try {
      const res = await fetch(GAS_URL + '?action=getBooked');
      const data = await res.json();
      if (data.success) bookedSlots = data.booked;
    } catch (e) {
      console.warn('無法載入已預約時段', e);
    }
  }

  function isSlotBooked(date, slot) {
    if (!date) return false;
    const dateStr = date.getFullYear() + ' 年 ' + (date.getMonth()+1) + ' 月 ' + date.getDate() + ' 日';
    return bookedSlots[dateStr + '_' + slot] === true;
  }

  function updateTimeSlots() {
    document.querySelectorAll('.time-slot').forEach(el => {
      const slot = el.dataset.slot;
      if (isSlotBooked(state.date, slot)) {
        el.classList.add('booked');
        el.classList.remove('selected');
        if (state.slot === slot) {
          state.slot = null;
          checkPage1();
        }
      } else {
        el.classList.remove('booked');
      }
    });
  }

  document.getElementById('btnConfirm').addEventListener('click', async () => {
    const btn = document.getElementById('btnConfirm');
    btn.disabled = true;
    btn.textContent = '送出中…';

    const d = state.date;
    const dateStr = d.getFullYear() + ' 年 ' + (d.getMonth()+1) + ' 月 ' + d.getDate() + ' 日';

    const payload = {
      date:         dateStr,
      slot:         state.slot,
      removal:      svcState['卸甲'].item,
      removalAddon: svcState['卸甲'].addon || '',
      gel:          svcState['凝膠'].item,
      gelAddon:     svcState['凝膠'].addon || '',
      design:       svcState['造型'].item,
      name:         state.name,
      ig:           state.ig,
      email:        state.email || '',
      note:         state.note  || '',
    };

    try {
      const res = await fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify(payload),
      });
      const result = await res.json();

      if (result.success) {
        document.getElementById('bookingCode').textContent = result.bookingCode;
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById('successPage').style.display = 'block';
        updateSteps(5);
      } else {
        alert('送出失敗，請稍後再試。\n（' + (result.error || '未知錯誤') + '）');
        btn.disabled = false;
        btn.textContent = '確認預約';
      }
    } catch (err) {
      alert('網路錯誤，請確認連線後再試。');
      btn.disabled = false;
      btn.textContent = '確認預約';
    }
  });

  function resetAll() {
    state.date = null; state.slot = null; state.service = null; state.price = 0; state.dur = '';
    state.name = ''; state.ig = ''; state.email = ''; state.note = '';
    state.calYear = 2026; state.calMonth = 4;
    ['卸甲','凝膠','造型'].forEach(cat => { svcState[cat] = { item: null, addon: null, itemPrice: 0, addonPrice: 0 }; });
    document.querySelectorAll('.time-slot').forEach(c => c.classList.remove('selected'));
    initBlocks();
    ['fName','fIG','fEmail','fNote'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('btn2').disabled = true;
    showPage(1);
  }

  loadBookedSlots().then(() => {
    renderCalendar();
  });
</script>
</body>
</html>
